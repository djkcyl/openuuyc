name: Linux deb

on:
  push:
    branches: [main, linux-port]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deb:
    # The oldest supported Ubuntu, so the package's glibc and library
    # requirements hold on 22.04 and everything newer.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake clang nasm pkg-config dpkg-dev libva-dev \
            libasound2-dev libdbus-1-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libwayland-dev libx11-dev libxcb1-dev libxrandr-dev libxi-dev \
            libxcursor-dev libgl1-mesa-dev libvulkan-dev libudev-dev libssl-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deb

      - name: Build
        run: cargo build --release --locked --bin OpenUUYC

      - name: Package
        run: cargo deb --no-build

      - name: Check the package installs
        run: |
          sudo apt-get install -y ./target/debian/*.deb
          OpenUUYC --version
          dpkg-deb --info target/debian/*.deb

      - uses: actions/upload-artifact@v7
        with:
          name: openuuyc-deb
          path: target/debian/*.deb
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: deb
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: openuuyc-deb
      - uses: softprops/action-gh-release@v3
        with:
          files: "*.deb"
