[package]
edition = "2021"
name = "webrtc-sctp"
version = "0.17.2"
authors = ["Rain Liu <yliu@webrtc.rs>"]
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "A pure Rust implementation of SCTP"
homepage = "https://webrtc.rs"
documentation = "https://docs.rs/webrtc-sctp"
license = "MIT/Apache-2.0"
repository = "https://github.com/webrtc-rs/webrtc/tree/master/sctp"

[lib]
name = "webrtc_sctp"
path = "src/lib.rs"

[dependencies.arc-swap]
version = "1"

[dependencies.async-trait]
version = "0.1"

[dependencies.bytes]
version = "1"

[dependencies.crc]
version = "3.2.1"

[dependencies.log]
version = "0.4"

[dependencies.portable-atomic]
version = "1.6"

[dependencies.rand]
version = "0.9"

[dependencies.thiserror]
version = "1"

[dependencies.tokio]
version = "1.32.0"
features = [
    "fs",
    "io-util",
    "io-std",
    "macros",
    "net",
    "parking_lot",
    "rt",
    "rt-multi-thread",
    "sync",
    "time",
]

[dependencies.util]
version = "0.17.1"
features = ["conn"]
default-features = false
package = "webrtc-util"

[dev-dependencies.chrono]
version = "0.4.28"

[dev-dependencies.clap]
version = "3"

[dev-dependencies.env_logger]
version = "0.11.3"

[dev-dependencies.lazy_static]
version = "1"

[lints.rust.unexpected_cfgs]
level = "warn"
priority = 0
check-cfg = ["cfg(fuzzing)"]
