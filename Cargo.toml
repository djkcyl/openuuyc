[package]
name = "openuuyc"
version = "1.0.0-alpha.10"
edition = "2024"
description = "Third-party Rust client for UU Remote protocol interoperability"
license-file = "LICENSE"
publish = false
default-run = "OpenUUYC"
autobins = false

[[bin]]
name = "OpenUUYC"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
async-trait = "0.1"
bytemuck = { version = "1.25.2", features = ["derive", "min_const_generics"] }
base64 = "0.22.1"
bytes = "1.11.1"
crossbeam-queue = "0.3.14"
cpal = "0.18.2"
clap = { version = "4.6.7", features = ["derive"] }
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
dunce = "1.0"
egui = { version = "0.36.1", default-features = false, features = ["bytemuck"] }
flate2 = "1.1.10"
futures-util = "0.3.34"
goog_cc = { path = "vendor/goog_cc" }
# NVENC hardware encoding for the host role (driver library loaded at run time).
openuuyc-nvenc-sys = { path = "vendor/nvenc-sys" }
hmac = "0.12.1"
hyper = { version = "1.11.1", default-features = false }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "bmp", "tiff"] }
keyring = "4.1.6"
keyring-core = "=1.0.0"
kcp = { path = "vendor/kcp" }
opusic-c = "1.6.1"
qrcode = { version = "0.14.1", default-features = false }
rand = "0.9"
prost = "0.14"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls-no-provider", "system-proxy", "gzip"] }
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "0.8.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
semver = "1.0"
sha2 = "0.10.9"
tokio = { version = "1.49", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time"] }
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["handshake"] }
tokio-rustls = { version = "0.26.5", default-features = false, features = ["ring", "tls12"] }
tokio-util = { version = "0.7", features = ["rt"] }
thiserror = "2.0.21"
tracing = "0.1.44"
tracing-appender = "0.2.4"
tracing-subscriber = { version = "0.3.22", features = ["env-filter", "fmt"] }
url = "2.5.8"
uuid = { version = "1.25.0", features = ["v4", "v5"] }
webrtc = { path = "vendor/webrtc" }
webrtc-srtp = "0.17.2"
yuv = "0.8.17"
object = { version = "0.37.3", default-features = false, features = ["read_core", "std", "pe"] }
openuuyc-plugin-api = { path = "plugins/sdk" }
libloading = "0.8.9"
openuuyc-codec = { path = "crates/codec" }
egui-winit = { version = "0.36.1", default-features = false, features = ["clipboard", "links"] }
winit = { version = "0.30.13", default-features = false, features = ["rwh_06"] }

[build-dependencies]
cc = "1.2"
embed-resource = "3.0.11"
epaint_default_fonts = "=0.36.1"
flate2 = "1.1.10"

[target.'cfg(windows)'.dependencies]
# Required by the generated code of #[windows::core::implement].
windows-core = "0.62.2"
# The host role's Intel VPL and AMD AMF encoders beside NVENC.
openuuyc-amf-sys = { path = "vendor/amf-sys" }
openuuyc-vpl-sys = { path = "vendor/vpl-sys" }
egui-directx11 = { path = "vendor/egui-directx11" }
windows = { version = "0.62.2", default-features = false, features = [
    "Foundation",
    "Data_Xml_Dom",
    "UI_Notifications",
    "Win32_System_WinRT",
    "Win32_System_Variant",
    "Win32_Devices_Display",
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_System_IO",
    "Win32_Foundation",
    "Win32_Media_Audio",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Networking_WinSock",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Direct3D12",
    "Win32_Graphics_DirectComposition",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_System_Console",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Ole",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Performance",
    "Win32_System_Power",
    "Win32_System_Threading",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_SystemInformation",
    "Win32_System_Registry",
    "Win32_System_JobObjects",
    "Win32_System_RemoteDesktop",
    "Win32_Storage_FileSystem",
    "Win32_System_LibraryLoader",
    "Win32_Security",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Input_Pointer",
    "Win32_UI_HiDpi",
    "Win32_System_StationsAndDesktops",
    "Win32_System_Services",
    "Win32_System_Pipes",
    "Win32_System_Shutdown",
    "Win32_Security_Authorization",
    "Win32_Security_WinTrust",
    "Win32_Security_Cryptography",
    "Win32_UI_Input_Ime",
    "Win32_UI_Shell",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "linux")'.dependencies]
# Local display geometry for the viewer, on X11 and Wayland alike.
display-info = "0.5.9"
cros-libva = { path = "vendor/cros-libva" }
# The H.264 syntax and its error kinds for the VA-API slice parameters; the
# software session itself goes through openuuyc-codec like on Windows.
openuuyc-h264 = { path = "crates/codec/kernels/h264" }
egui-wgpu = { version = "0.36.1", default-features = false }
wgpu = { version = "30.0", default-features = false, features = ["vulkan", "gles", "wgsl"] }
egui-winit = { version = "0.36.1", default-features = false, features = ["clipboard", "links", "x11", "wayland"] }
winit = { version = "0.30.13", default-features = false, features = ["rwh_06", "x11", "wayland", "wayland-dlopen"] }
arboard = { version = "3.6.1", default-features = false, features = ["image-data", "wayland-data-control"] }
libc = "0.2"
fuser = { version = "0.15", default-features = false }
x11rb = { version = "0.13", features = ["randr", "shm", "xfixes", "xtest"] }
# Notification-area icon (StatusNotifierItem), the counterpart of the Windows tray.
# zbus must stay on async-io: its tokio feature is global, and makes the
# blocking Secret Service calls of the keyring panic inside our runtime.
ksni = { version = "0.3.6", default-features = false, features = ["blocking", "async-io"] }
# Desktop notifications (org.freedesktop.Notifications), the counterpart of
# Windows toasts; the same async-io zbus as above.
zbus = { version = "5.19", default-features = false, features = ["async-io", "blocking-api"] }
# Host capture through the XDG ScreenCast portal (Wayland, and X11 on request).
ashpd = { version = "0.13.13", default-features = false, features = ["async-io", "screencast"] }
pollster = "0.4"

[patch.crates-io]
dtls = { path = "vendor/dtls" }
interceptor = { path = "vendor/interceptor" }
rtcp = { path = "vendor/rtcp" }
turn = { path = "vendor/turn" }
webrtc-ice = { path = "vendor/webrtc-ice" }
webrtc-sctp = { path = "vendor/webrtc-sctp" }
webrtc-srtp = { path = "vendor/webrtc-srtp" }
webrtc-util = { path = "vendor/webrtc-util" }

[profile.release]
# Keep playback dependencies, including decoder and SIMD kernels, at their original
# speed settings. Cross-crate LTO changed hot-code layout in decoder comparisons.
opt-level = 3
lto = false
# One unit avoids repeated async state machines and their unwind metadata.
codegen-units = 1
strip = "debuginfo"
# Decoder workers rely on unwinding to contain failures and release resources.
panic = "unwind"

[profile.release.package.openuuyc]
# Optimize application glue for size without changing decoder/DSP dependencies.
opt-level = "s"

# Preserve the validated code generation of the video/SIMD kernels.
[profile.release.package.openuuyc-h264]
codegen-units = 16

[profile.release.package.yuv]
codegen-units = 16

# Startup, HTTP management and certificate parsing are outside the media path.
# Keep the real-time transport, crypto, rendering and codecs at level 3.
[profile.release.package.reqwest]
opt-level = "s"

[profile.release.package.clap_builder]
opt-level = "s"

[profile.release.package.x509-parser]
opt-level = "s"

[profile.dev.package.yuv]
opt-level = 3
debug-assertions = false
overflow-checks = false

[profile.dev.package.openuuyc-h264]
opt-level = 3



[profile.dev.package.openuuyc-h265-syntax]
opt-level = 3
debug-assertions = false
overflow-checks = false
